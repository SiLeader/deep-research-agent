[server]
host = "127.0.0.1"
port = 8080

[agent]
# Model ID used when a role-specific model is omitted.
model = "default"
# Maximum LLM calls per agent invocation (including Explorer); must be positive.
max_llm_calls = 30
# Optional role-specific overrides. Omitted models use agent.model;
# omitted system prompts use the embedded Markdown defaults.
[agent.planner]
# model = "default"
# system_prompt = "..."

[agent.research]
# model = "default"
# system_prompt = "..."

[agent.gap_judger]
# model = "default"
# system_prompt = "..."

[agent.explorer]
# model = "default"
# system_prompt = "..."

[agent.synthesizer]
# model = "default"
# system_prompt = "..."

[[models]]
id = "default"
provider = "openai"
name = "your-model-name"
# Defaults to 1; shared by all agent roles using this model ID.
max_concurrency = 1
# Deadline for each chat request, after acquiring the model concurrency slot.
# Defaults to 120 seconds; must be positive. Embedding uses its own timeout below.
request_timeout_secs = 120

[[providers]]
id = "openai"
type = "OpenAI"
api_key_env = "OPENAI_API_KEY"
# Optional API base URL, including any required path and trailing slash.
# endpoint = "http://127.0.0.1:8000/v1/"

[tools.web_search.searxng]
# Full search URL. SearXNG must permit JSON responses.
endpoint = "http://127.0.0.1:8888/search"
# The configured search endpoint may be internal; its HTTP response is still bounded.
connect_timeout_secs = 10
request_timeout_secs = 60
max_body_bytes = 2097152

# Web request limits must be positive. Fetch allows public HTTP(S) destinations only.
[tools.web_fetch]
connect_timeout_secs = 10
request_timeout_secs = 60
max_body_bytes = 2097152

# Fresh in-memory database per Explorer invocation; no external models required.
[tools.fetched]
# Character limit per evidence chunk; must be positive.
chunk_size = 1024
# Search result counts; 0 < default_top_k <= max_top_k.
default_top_k = 5
max_top_k = 20

# Optional: reuse an entry in [[models]] with an OpenAI-compatible embedding model.
# Register that model separately from the chat model; its max_concurrency is shared
# by all embedding calls. The existing provider supplies endpoint and API key.
# [tools.fetched.embedding]
# model = "embedding"
# request_timeout_secs = 60

# Optional, independent of embedding. Base URL: /rerank is appended once.
# [tools.fetched.reranker]
# endpoint = "http://127.0.0.1:8001/v1/"
# model = "your-reranker-model"
# api_key_env = "RERANKER_API_KEY" # omit for a server without authentication
# request_timeout_secs = 60
# max_concurrency = 1
